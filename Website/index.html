<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Олимпиада — рейтинг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  footer {margin-top: 40px;font-size: 13px;color: var(--text-dim);display: flex;flex-direction: column; /* Выстраиваем логотип и текст друг под другом /align-items: center;    / Центрируем все элементы /gap: 24px;              / Расстояние между большим логотипом и текстом ниже */}.footer-logo-wrapper {display: flex;justify-content: center;width: 100%;}
  .footer-logo {height: 77px;
    margin-top: 40px;
    width: auto;
    object-fit: contain;
  }.footer-status {width: 100%;text-align: center;     /* Центрируем текст обновления */}
.logo-container {
  display: flex;
  justify-content: center; /* Центрируем оба логотипа */
  align-items: center;     /* Выравниваем по вертикали */
  gap: 77px;               /* Небольшое расстояние между границами картинок */
  margin-bottom: 32px;     /* Отступ снизу до заголовка */
}

.logo {
  height: 77px;            
  width: auto;       /* Ограничиваем максимальную ширину, чтобы обрезать невидимые поля */
  object-fit: contain;     /* Гарантирует, что логотип не деформируется */
}


header {
  text-align: center;
}
  :root {
    --bg: #12203A;
    --bg-elevated: #182A4A;
    --text: #EDE9DC;
    --text-dim: #92A3BC;
    --accent: #C9A24B;
    --accent-soft: #7E8CA6;
    --rule: rgba(237, 233, 220, 0.14);
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'IBM Plex Sans', -apple-system, Segoe UI, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  header {
    margin-bottom: 40px;
  }

  .kicker {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(28px, 5vw, 38px);
    line-height: 1.15;
    margin: 0 0 8px;
  }

  .subline {
    color: var(--text-dim);
    font-size: 15px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
  }

  thead th {
    text-align: left;
    font-weight: 500;
    font-size: 13px;
    color: var(--text-dim);
    padding: 10px 8px;
    border-bottom: 1px solid var(--rule);
  }

  thead th.score-col, tbody td.score-col {
    text-align: right;
  }

  tbody td {
    padding: 14px 8px;
    border-bottom: 1px solid var(--rule);
    font-size: 16px;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  .rank {
    font-family: var(--font-mono);
    color: var(--text-dim);
    width: 40px;
  }

  tbody tr:nth-child(-n+3) .rank {
    color: var(--accent);
  }

  tbody tr:nth-child(-n+3) .name {
    font-weight: 500;
  }

  .score-col {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  .skeleton-row td {
    padding: 14px 8px;
  }

  .skeleton-bar {
    height: 14px;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--bg-elevated) 25%, rgba(237,233,220,0.08) 37%, var(--bg-elevated) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.6s ease infinite;
  }

  @keyframes shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: -100% 0; }
  }

  footer {
    margin-top: 28px;
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
    vertical-align: middle;
  }

  @media (max-width: 460px) {
    .page { padding: 32px 16px 48px; }
    .logo-container { gap: 32px; margin-bottom: 24px; }
    .logo { height: 44px; }
    .footer-logo { height: 44px; margin-top: 12px; }
    header { margin-bottom: 28px; }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { min-width: 380px; }
    thead th:nth-child(1), tbody td.rank { padding-left: 4px; }
    thead th, tbody td { padding: 10px 6px; font-size: 13px; }
  }

  @media (max-width: 340px) {
    .logo-container { gap: 20px; }
    .logo { height: 36px; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="logo-container">
  <img class="logo" src="images/Group 16.png" alt="Логотип PRIME">
  <img class="logo" src="https://www.kais.school/_next/image?url=%2Flogo_mark.webp&w=3840&q=75" alt="Логотип школы">
  </div>
  <header>
    <div class="kicker" id="kicker"></div>
    <h1 id="title">Рейтинг олимпиады</h1>
    <div class="subline" id="subline">Результаты обновляются автоматически</div>
  </header>

  <div class="table-scroll">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>User</th>
        <th class="score-col">Score</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <!-- filled by JS; skeleton rows shown by default -->
    </tbody>
  </table>
  </div>

<footer>

  <div class="footer-status">
    <span><span class="dot"></span><span id="updated">Загружаем результаты</span></span>
  </div>
    <div class="footer-logo-wrapper">
    <img class="footer-logo" src="images/Group 16.png" alt="Логотип PRIME">
  </div>
</footer>

</div>

<script>
/* ====================== НАСТРОЙКА ======================
   1. В Google Таблице: Файл → Поделиться → Опубликовать в интернете
      → выбрать нужный лист → формат CSV → Опубликовать.
   2. Вставить полученную ссылку в CSV_URL ниже.
   3. Таблица должна содержать колонки с именем участника и баллом —
      их названия указать в COLUMNS ниже (регистр не важен).
   ========================================================= */
  const CONFIG = {
    CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRAfbJrVp_KQfuiQhbRQkIBlEv1QKdcSbG8Lh3fUJh1rhtXiEowiO31D3f8CfrCUOWizth57lZ91m_w/pubhtml?gid=0&single=true",
    COLUMNS: { name: "Имя", score: "Балл" },
    SUBJECT_LABEL: "PRIME Olympiad · 07.10",
    TITLE: "Рейтинг олимпиады",
    REFRESH_MS: 60000,
    CACHE_KEY: "olympiad_leaderboard_cache_v1"
  };

  document.getElementById("kicker").textContent = CONFIG.SUBJECT_LABEL;
  document.getElementById("title").textContent = CONFIG.TITLE;

  const tbody = document.getElementById("tbody");
  const updatedEl = document.getElementById("updated");
  const sublineEl = document.getElementById("subline");

  function showSkeleton(rows = 6) {
    tbody.innerHTML = "";
    for (let i = 0; i < rows; i++) {
      const tr = document.createElement("tr");
      tr.className = "skeleton-row";
      tr.innerHTML = `
        <td class="rank"><div class="skeleton-bar" style="width:16px"></div></td>
        <td><div class="skeleton-bar" style="width:${60 + Math.random()*30}%"></div></td>
        <td class="score-col"><div class="skeleton-bar" style="width:24px;margin-left:auto"></div></td>`;
      tbody.appendChild(tr);
    }
  }

  function renderRows(rows) {
    tbody.innerHTML = "";
    rows.forEach((row, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="rank">${i + 1}</td>
        <td class="name">${escapeHtml(row.name)}</td>
        <td class="score-col">${escapeHtml(row.score)}</td>`;
      tbody.appendChild(tr);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = String(str ?? "");
    return div.innerHTML;
  }

  function timeAgo(ts) {
    const diffMin = Math.max(0, Math.round((Date.now() - ts) / 60000));
    if (diffMin < 1) return "Обновлено только что";
    if (diffMin === 1) return "Обновлено 1 минуту назад";
    if (diffMin < 5) return `Обновлено ${diffMin} минуты назад`;
    return `Обновлено ${diffMin} минут назад`;
  }

  function loadCache() {
    try {
      const raw = localStorage.getItem(CONFIG.CACHE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      return null;
    }
  }

  function saveCache(rows) {
    try {
      localStorage.setItem(CONFIG.CACHE_KEY, JSON.stringify({ rows, ts: Date.now() }));
    } catch (e) { /* quietly ignore */ }
  }

  let lastGoodTs = null;

  function refresh() {
    if (!CONFIG.CSV_URL || CONFIG.CSV_URL.includes("ВСТАВЬ_СЮДА")) {
      sublineEl.textContent = "Источник данных ещё не подключён";
      updatedEl.textContent = "—";
      return;
    }

    Papa.parse(CONFIG.CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        try {
          const rows = results.data
            .map(r => ({
              name: r[CONFIG.COLUMNS.name],
              score: Number(r[CONFIG.COLUMNS.score]) || 0
            }))
            .filter(r => r.name)
            .sort((a, b) => b.score - a.score);

          if (rows.length === 0) throw new Error("empty");

          renderRows(rows);
          saveCache(rows);
          lastGoodTs = Date.now();
          sublineEl.textContent = "Результаты обновляются автоматически";
          updatedEl.textContent = timeAgo(lastGoodTs);
        } catch (e) {
          fallbackToCache();
        }
      },
      error: () => fallbackToCache()
    });
  }

  function fallbackToCache() {
    const cached = loadCache();
    if (cached && cached.rows && cached.rows.length) {
      renderRows(cached.rows);
      lastGoodTs = cached.ts;
      updatedEl.textContent = timeAgo(lastGoodTs);
    }
    // если кэша тоже нет — просто оставляем скелет, без текста ошибки
  }

  showSkeleton();
  refresh();
  setInterval(refresh, CONFIG.REFRESH_MS);
  setInterval(() => { if (lastGoodTs) updatedEl.textContent = timeAgo(lastGoodTs); }, 30000);
</script>

</body>
</html>
